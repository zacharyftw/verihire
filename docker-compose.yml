services:
  # VeriHire Code Execution Sandbox
  sandbox:
    build:
      context: ./docker
      dockerfile: Dockerfile.sandbox
    image: verihire-sandbox
    container_name: verihire-sandbox
    command: ['echo', 'Sandbox image ready']
    profiles: ['build-only']

  # Execution Server — wraps Docker to execute code in sandbox containers
  execution-server:
    image: docker:cli
    container_name: verihire-execution-server
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./docker/execution-server.js:/app/server.js:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    entrypoint: ['sh', '-c', 'apk add --no-cache nodejs && node /app/server.js']
    environment:
      PORT: 9090
      SANDBOX_IMAGE: verihire-sandbox
      TIMEOUT: 10
      MEMORY_LIMIT: 256m

networks:
  default:
    name: verihire-network
