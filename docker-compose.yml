services:
  # Mailhog for local email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: verihire-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  # Judge0 CE - Code Execution Sandbox
  judge0-server:
    image: judge0/judge0:1.13.0
    container_name: verihire-judge0-server
    restart: unless-stopped
    ports:
      - '2358:2358'
    environment:
      - POSTGRES_HOST=judge0-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_dev
      - POSTGRES_DB=judge0
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=judge0_dev
      - RAILS_MAX_THREADS=4
      - RAILS_ENV=production
      - ALLOW_ORIGIN=*
    depends_on:
      judge0-postgres:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    privileged: true

  judge0-worker:
    image: judge0/judge0:1.13.0
    container_name: verihire-judge0-worker
    restart: unless-stopped
    command: ['./scripts/workers']
    environment:
      - POSTGRES_HOST=judge0-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_dev
      - POSTGRES_DB=judge0
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=judge0_dev
      - RAILS_MAX_THREADS=4
      - RAILS_ENV=production
    depends_on:
      judge0-postgres:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    privileged: true

  judge0-postgres:
    image: postgres:16-alpine
    container_name: verihire-judge0-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_dev
      POSTGRES_DB: judge0
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U judge0']
      interval: 10s
      timeout: 5s
      retries: 5

  judge0-redis:
    image: redis:7-alpine
    container_name: verihire-judge0-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    command: redis-server --appendonly yes --requirepass judge0_dev
    volumes:
      - judge0_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', 'judge0_dev', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  judge0_postgres_data:
  judge0_redis_data:

networks:
  default:
    name: verihire-network
