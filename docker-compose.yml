version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verihire-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verihire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verihire_dev}
      POSTGRES_DB: ${POSTGRES_DB:-verihire}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-verihire}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: verihire-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-verihire_dev}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD:-verihire_dev}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: verihire-elasticsearch
    restart: unless-stopped
    ports:
      - '9200:9200'
      - '9300:9300'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health | grep -q green']
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO for local S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: verihire-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-verihire}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-verihire_dev}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # Mailhog for local email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: verihire-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  # ML Service for AI evaluation and candidate matching
  ml:
    build:
      context: ./apps/ml
      dockerfile: Dockerfile
    container_name: verihire-ml
    restart: unless-stopped
    ports:
      - '4200:4200'
    environment:
      - HOST=0.0.0.0
      - PORT=4200
      - REDIS_URL=redis://:${REDIS_PASSWORD:-verihire_dev}@redis:6379
      - MODEL_CACHE_DIR=/tmp/verihire-models
      - DEVICE=cpu
      - LOG_LEVEL=INFO
    volumes:
      - ml_model_cache:/tmp/verihire-models
    depends_on:
      - redis
    healthcheck:
      test: ['CMD', 'python', '-c', "import httpx; httpx.get('http://localhost:4200/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s # Models take time to load
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G # ML models need memory
        reservations:
          memory: 2G

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  minio_data:
  ml_model_cache:

networks:
  default:
    name: verihire-network
