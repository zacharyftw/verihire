[build]
builder = "nixpacks"
buildCommand = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @verihire/api build"

[deploy]
startCommand = "cd apps/api && node dist/main"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"

[deploy.watchPatterns]
paths = ["apps/api/**", "packages/**"]
